(function () {
    const origInstantiate = WebAssembly.instantiate.bind(WebAssembly);
    const origInstantiateStreaming = WebAssembly.instantiateStreaming
        ? WebAssembly.instantiateStreaming.bind(WebAssembly)
        : null;

    WebAssembly.instantiate = function (bufferOrModule, importObject) {
        console.log('[WASM DEBUG] instantiate() imports:', importObject, new Error().stack);
        return origInstantiate(bufferOrModule, importObject);
    };

    if (origInstantiateStreaming) {
        WebAssembly.instantiateStreaming = function (source, importObject) {
            console.log('[WASM DEBUG] instantiateStreaming() imports:', importObject, new Error().stack);
            return origInstantiateStreaming(source, importObject);
        };
    }
})();
</script>

<script>
(function () {
    const originalFetch = window.fetch.bind(window);

    const chunkUrls = [
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part1",
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part2",
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part3",
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part4",
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part5",
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part6",
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part7",
        "https://cdn.jsdelivr.net/gh/pivotanimationsforyou7-ship-it/serial-hitbox-abuser-html@main/html5.wasm.part8"
    ];

    const progressBar = document.getElementById('wasm-loader-bar');
    const progressText = document.getElementById('wasm-loader-text');
    const loaderUi = document.getElementById('wasm-loader-ui');

    let wasmBytesPromise = null;

    function buildWasmBytes() {
        if (wasmBytesPromise) return wasmBytesPromise;

        let completedChunks = 0;

        wasmBytesPromise = Promise.all(chunkUrls.map((url, index) =>
            originalFetch(url).then(async res => {
                if (!res.ok) throw new Error(`Failed to download part ${index + 1}`);
                const buffer = await res.arrayBuffer();
                completedChunks++;
                const percent = Math.round((completedChunks / chunkUrls.length) * 100);
                if (progressBar) progressBar.style.width = percent + '%';
                if (progressText) progressText.innerText = `Downloaded chunk ${completedChunks} of ${chunkUrls.length}...`;
                return buffer;
            })
        )).then(async buffers => {
            if (progressText) progressText.innerText = "Reassembling engine file...";

            const totalLength = buffers.reduce((sum, buf) => sum + buf.byteLength, 0);
            const combined = new Uint8Array(totalLength);
            let offset = 0;
            for (const buf of buffers) {
                combined.set(new Uint8Array(buf), offset);
                offset += buf.byteLength;
            }

            let finalBytes = combined;

            // gzip magic bytes: 1f 8b — decompress if the parts were gzipped before splitting
            if (combined[0] === 0x1f && combined[1] === 0x8b) {
                if (progressText) progressText.innerText = "Decompressing engine file...";
                const ds = new DecompressionStream('gzip');
                const stream = new Blob([combined]).stream().pipeThrough(ds);
                finalBytes = new Uint8Array(await new Response(stream).arrayBuffer());
            }

            if (loaderUi) loaderUi.style.display = 'none';
            return finalBytes;
        }).catch(err => {
            if (progressText) {
                progressText.innerText = "Error assembling game chunks.";
                progressText.style.color = "#ff4d4d";
            }
            console.error(err);
            throw err;
        });

        return wasmBytesPromise;
    }

    // Intercept only the request for the main wasm file; everything else passes through untouched.
    window.fetch = function (input, init) {
        const url = typeof input === 'string' ? input : (input && input.url) || '';
        if (url.endsWith('html5.wasm')) {
            return buildWasmBytes().then(bytes => new Response(bytes, {
                status: 200,
                headers: { 'Content-Type': 'application/wasm' }
            }));
        }
        return originalFetch(input, init);
    };
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"html5","experimentalVK":false,"fileSizes":{"html5.pck":2521564,"html5.wasm":37902138},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
